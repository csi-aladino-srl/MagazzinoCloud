<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Magazzino Cloud</title>
    
    <!-- PWA & iOS Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Magazzino">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                    colors: {
                        md: {
                            'primary': '#1b6d37',
                            'on-primary': '#ffffff',
                            'primary-container': '#a6f5b2',
                            'on-primary-container': '#00210b',
                            'surface': '#f7fbf3',
                            'on-surface': '#191c19',
                            'surface-variant': '#dee5d9',
                            'on-surface-variant': '#424940',
                            'outline': '#72796f',
                            'outline-variant': '#c2c9bd',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full w-full m-0 p-0 bg-md-surface text-md-on-surface font-sans antialiased flex flex-col justify-center items-center">

    <!-- Material 3 Surface Card -->
    <main class="w-full max-w-sm mx-auto p-6">
        <div class="bg-white/80 backdrop-blur-md border border-md-outline-variant/40 rounded-[28px] p-8 shadow-sm flex flex-col items-center text-center">
            
            <!-- Icon Indicator Container -->
            <div id="iconBg" class="w-20 h-20 bg-md-primary-container text-md-on-primary-container rounded-full flex items-center justify-center mb-6 transition-all duration-300">
                <span id="statusIcon" class="material-symbols-outlined text-4xl">notifications_active</span>
            </div>

            <!-- Header Text -->
            <h1 class="text-2xl font-bold tracking-tight text-md-on-surface mb-2">
                Accesso Magazzino
            </h1>
            
            <p id="subText" class="text-sm font-normal text-md-on-surface-variant mb-8 px-2 leading-relaxed">
                Premi il pulsante per abilitare le notifiche ed accedere al magazzino.
            </p>

            <!-- Material 3 Button -->
            <button id="mainBtn" onclick="attivaNotificheERedirect()" class="w-full h-14 bg-md-primary hover:bg-md-primary/90 active:bg-md-primary/80 text-md-on-primary font-medium rounded-full shadow-sm transition-all duration-200 flex items-center justify-center gap-2 text-base px-6 active:scale-98">
                <span id="btnIcon" class="material-symbols-outlined text-xl">notifications</span>
                <span id="btnText" class="tracking-wide">Abilita Notifiche e Accedi</span>
            </button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbyma9BDUgpG5KUMyLJxbFjuPsuLpYyMA",
            authDomain: "warehouse-manager-462a0.firebaseapp.com",
            projectId: "warehouse-manager-462a0",
            storageBucket: "warehouse-manager-462a0.firebasestorage.app",
            messagingSenderId: "234467047556",
            appId: "1:234467047556:web:50c352780b476574b86ad1",
            measurementId: "G-KM84BW8EPH"
        };

        const vapidKey = 'BFiPE5viverzVuCBidehPLPuHmIhfIl7XbO2nLe4PIkNxeBYg_GoRdHZ2698ugpp4eexwCH30mEkPOi3TyWQH7w';

        const app = initializeApp(firebaseConfig);
        let messaging = null;


        try {
            messaging = getMessaging(app);
        } catch (e) {
            console.warn("Messaging non supportato:", e);
        }

        // Registrazione Service Worker
// Registrazione Service Worker con controllo aggiornamenti
// Registrazione Service Worker con controllo aggiornamenti forzato
if ('serviceWorker' in navigator) {
    const APP_VERSION = '1.0.1'; // Incrementa questo numero ogni volta che fai modifiche su GitHub!

    navigator.serviceWorker.register('firebase-messaging-sw.js?v=' + APP_VERSION, { updateViaCache: 'none' })
        .then((registration) => {
            registration.update();
            
            registration.onupdatefound = () => {
                const installingWorker = registration.installing;
                installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed') {
                        if (navigator.serviceWorker.controller) {
                            window.location.reload(true);
                        }
                    }
                };
            };
        })
        .catch(err => console.warn("Errore registrazione Service Worker:", err));
}    

        // Aggiorna l'interfaccia se le notifiche sono già state autorizzate
        function controllaStatoNotifiche() {
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const subText = document.getElementById('subText');
            const statusIcon = document.getElementById('statusIcon');
            const iconBg = document.getElementById('iconBg');

            if ('Notification' in window && Notification.permission === 'granted') {
                if (btnText) btnText.innerText = "Accedi al Magazzino";
                if (btnIcon) btnIcon.innerText = "arrow_forward";
                if (subText) subText.innerText = "Notifiche già abilitate. Clicca per accedere.";
                if (statusIcon) statusIcon.innerText = "check_circle";
                if (iconBg) {
                    iconBg.className = "w-20 h-20 bg-md-primary text-md-on-primary rounded-full flex items-center justify-center mb-6 transition-all duration-300";
                }
            }
        }

        document.addEventListener('DOMContentLoaded', controllaStatoNotifiche);

        // Procedura di richiesta notifiche, estrazione token e reindirizzamento
        window.attivaNotificheERedirect = async function() {
            const targetUrl = "warehouse.html";

            try {
                if ('Notification' in window) {
                    const permission = await Notification.requestPermission();
                    if (permission === 'granted') {
                        if (messaging) {
                            const registration = await navigator.serviceWorker.ready;
                            const token = await getToken(messaging, { 
                                vapidKey: vapidKey,
                                serviceWorkerRegistration: registration 
                            });
                            console.log("FCM Token generato:", token);
                        }
                    } else {
                        alert("Notifiche non autorizzate. Potrai attivarle successivamente dalle impostazioni.");
                    }
                }
            } catch (err) {
                console.error("Errore durante l'attivazione delle notifiche:", err);
            } finally {
                // Reindirizzamento al file locale salvato sull'host
                window.location.href = targetUrl;
            }
        };
    </script>
</body>
</html>
