<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Magazzino Cloud</title>
    
    <!-- PWA & iOS Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Magazzino">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                    colors: {
                        md: {
                            'primary': '#1b6d37',
                            'on-primary': '#ffffff',
                            'primary-container': '#a6f5b2',
                            'on-primary-container': '#00210b',
                            'surface': '#f7fbf3',
                            'on-surface': '#191c19',
                            'surface-variant': '#dee5d9',
                            'on-surface-variant': '#424940',
                            'outline': '#72796f',
                            'outline-variant': '#c2c9bd',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full w-full m-0 p-0 bg-md-surface text-md-on-surface font-sans antialiased flex flex-col justify-center items-center">

    <!-- Material 3 Surface Card -->
    <main class="w-full max-w-sm mx-auto p-6">
        <div class="bg-white/80 backdrop-blur-md border border-md-outline-variant/40 rounded-[28px] p-8 shadow-sm flex flex-col items-center text-center">
            
            <!-- Icon Indicator Container -->
            <div id="iconBg" class="w-20 h-20 bg-md-primary-container text-md-on-primary-container rounded-full flex items-center justify-center mb-6 transition-all duration-300">
                <span id="statusIcon" class="material-symbols-outlined text-4xl">notifications_active</span>
            </div>

            <!-- Header Text -->
            <h1 class="text-2xl font-bold tracking-tight text-md-on-surface mb-2">
                Accesso Magazzino
            </h1>
            
            <p id="subText" class="text-sm font-normal text-md-on-surface-variant mb-8 px-2 leading-relaxed">
                Per proseguire è necessario abilitare le notifiche.
            </p>

            <!-- Material 3 Button -->
            <button id="mainBtn" onclick="attivaNotificheERedirect()" class="w-full h-14 bg-md-primary hover:bg-md-primary/90 active:bg-md-primary/80 text-md-on-primary font-medium rounded-full shadow-sm transition-all duration-200 flex items-center justify-center gap-2 text-base px-6 active:scale-98">
                <span id="btnIcon" class="material-symbols-outlined text-xl">notifications</span>
                <span id="btnText" class="tracking-wide">Abilita Notifiche</span>
            </button>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbyma9BDUgpG5KUMyLJxbFjuPsuLpYyMA",
            authDomain: "warehouse-manager-462a0.firebaseapp.com",
            projectId: "warehouse-manager-462a0",
            storageBucket: "warehouse-manager-462a0.firebasestorage.app",
            messagingSenderId: "234467047556",
            appId: "1:234467047556:web:50c352780b476574b86ad1",
            measurementId: "G-KM84BW8EPH"
        };

        const vapidKey = 'BFiPE5viverzVuCBidehPLPuHmIhfIl7XbO2nLe4PIkNxeBYg_GoRdHZ2698ugpp4eexwCH30mEkPOi3TyWQH7w';

        const app = initializeApp(firebaseConfig);
        let messaging = null;

        try {
            messaging = getMessaging(app);
        } catch (e) {
            console.warn("Messaging non supportato:", e);
        }

        // Registrazione Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('firebase-messaging-sw.js')
                .then(() => console.log("Service Worker registrato."))
                .catch(err => console.warn("Errore Service Worker:", err));
        }

// Controllo stato iniziale dell'interfaccia (senza redirect automatico)
function controllaStatoNotifiche() {
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const subText = document.getElementById('subText');
    const statusIcon = document.getElementById('statusIcon');
    const iconBg = document.getElementById('iconBg');

    if ('Notification' in window && Notification.permission === 'granted') {
        if (btnText) btnText.innerText = "Conferma e Accedi";
        if (btnIcon) btnIcon.innerText = "arrow_forward";
        if (subText) subText.innerText = "Clicca per aggiornare il token ed accedere.";
        if (statusIcon) statusIcon.innerText = "notifications_active";
    }
}

document.addEventListener('DOMContentLoaded', controllaStatoNotifiche);

// Gestione clic: registra il token FCM prima di reindirizzare
window.attivaNotificheERedirect = async function() {
    const targetUrl = "warehouse.html";

    try {
        if ('Notification' in window) {
            // Richiede il permesso se non ancora concesso
            const permission = await Notification.requestPermission();
            
            if (permission === 'granted') {
                if (messaging) {
                    const registration = await navigator.serviceWorker.ready;
                    const token = await getToken(messaging, { 
                        vapidKey: vapidKey,
                        serviceWorkerRegistration: registration 
                    });
                    console.log("FCM Token registrato:", token);
                }
            } else {
                alert("Permesso notifiche negato. Abilitalo nelle Impostazioni di iOS.");
            }
        }
    } catch (err) {
        console.error("Errore durante la registrazione del token:", err);
    } finally {
        // Reindirizza solo dopo l'esecuzione del codice
        window.location.href = targetUrl;
    }
};
    </script>
</body>
</html>
